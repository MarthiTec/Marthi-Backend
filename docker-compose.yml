services:
  postgres:
    image: postgres:16-alpine
    container_name: marthi-totem-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: marthi
      POSTGRES_PASSWORD: marthi
      POSTGRES_DB: marthi_totem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marthi -d marthi_totem']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
